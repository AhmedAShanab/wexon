<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05060f">
  <meta name="color-scheme" content="dark">
  <!-- wexon-seo --><!-- /wexon-seo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/gallery-assets/gallery.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js" defer></script>
  <script src="/gallery-assets/gallery.js" defer></script>
</head>
<body data-gallery-mode="image" data-layout="drift">

  <header class="g-nav">
    <a class="g-brand" href="/"><span class="g-brand-dot" aria-hidden="true"></span><span data-brand>Wexon</span></a>
    <nav class="g-nav-links" aria-label="التنقل">
      <a href="/">الرئيسية</a>
      <a href="/video-gallery">معرض الفيديو</a>
    </nav>
  </header>

  <section class="g-hero" aria-labelledby="page-title">
    <p class="g-eyebrow" data-gallery-eyebrow>WEXON DESIGN ARCHIVE</p>
    <h1 class="g-title" id="page-title" data-gallery-title>معرض التصاميم</h1>
    <div class="g-hero-row">
      <p class="g-desc" data-gallery-description>أرشيف شامل لأعمال الهوية، السوشل، الحملات والتجارب البصرية.</p>
      <div class="g-hero-meta">
        <span class="g-count" data-work-count aria-live="polite">…</span>
        <a class="g-cta" href="/#contact" data-gallery-cta>ابدأ مشروعك</a>
      </div>
    </div>
  </section>

  <p class="g-status" data-status role="alert" hidden></p>

  <div class="g-toolbar">
    <div class="g-filters" data-filter-list aria-label="تصفية الأعمال"></div>
    <span class="g-result" data-result-label aria-live="polite"></span>
  </div>

  <main class="g-main" id="gallery" data-gallery-root aria-live="polite"></main>

  <footer class="g-footer"><span data-brand>Wexon</span> — إبداع بصري وهويات تتحرك</footer>

  <aside class="g-switcher" aria-label="معاينة مؤقتة للأنماط">
    <span class="g-sw-label">معاينة مؤقتة</span>
    <button type="button" data-layout-option="drift" aria-pressed="true">صالة العرض الحرّة</button>
    <button type="button" data-layout-option="lighttable" aria-pressed="false">الطاولة الضوئية</button>
    <button type="button" data-layout-option="slivers" aria-pressed="false">أجنحة العرض</button>
    <button type="button" data-layout-option="corridor" aria-pressed="false">الممر البصري</button>
    <button type="button" data-layout-option="road" aria-pressed="false">الطريق اللانهائي</button>
  </aside>

  <div class="g-modal" data-modal data-open="false" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="g-modal-box">
      <button class="g-modal-close" type="button" data-modal-close aria-label="إغلاق">✕</button>
      <div class="g-modal-media" data-modal-media></div>
      <div class="g-modal-info">
        <p class="g-modal-tag" data-modal-tag></p>
        <h2 class="g-modal-title" id="modal-title" data-modal-title></h2>
        <p class="g-modal-desc" data-modal-description></p>
        <dl class="g-meta" data-metadata></dl>
        <a class="g-modal-page" data-modal-page href="#">الصفحة الكاملة للمشروع ↗</a>
        <div class="g-modal-navrow">
          <button type="button" class="g-modal-nav" data-modal-prev aria-label="السابق">→</button>
          <button type="button" class="g-modal-nav" data-modal-next aria-label="التالي">←</button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
