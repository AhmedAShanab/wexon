<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05060f">
  <meta name="color-scheme" content="dark">
  <!-- wexon-seo --><!-- /wexon-seo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/gallery-assets/case.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js" defer></script>
  <script src="/gallery-assets/case.js" defer></script>
</head>
<body data-case-mode="image">

  <div class="cs-progress" data-cs-progress aria-hidden="true"><i data-cs-progress-bar></i></div>

  <header class="g-nav">
    <a class="g-brand" href="/"><span class="g-brand-dot" aria-hidden="true"></span><span data-brand>Wexon</span></a>
    <nav class="g-nav-links" aria-label="التنقل">
      <a href="/">الرئيسية</a>
      <a href="/gallery" data-nav-gallery>المعرض</a>
    </nav>
  </header>

  <p class="cs-status" data-status role="alert" hidden></p>

  <main class="cs-main" data-case-root hidden>

    <!-- hero -->
    <section class="cs-hero">
      <div class="cs-hero-media" data-hero-media></div>
      <div class="cs-hero-veil" aria-hidden="true"></div>
      <div class="cs-hero-copy">
        <p class="cs-crumb"><a href="/" data-brand>Wexon</a><span>/</span><a href="/gallery" data-crumb-gallery>المعرض</a><span>/</span><b data-crumb-title></b></p>
        <p class="gc-tag" data-hero-tag></p>
        <h1 class="cs-title" data-hero-title></h1>
        <div class="cs-hero-meta" data-hero-meta></div>
      </div>
      <button type="button" class="cs-sound" data-sound-toggle hidden aria-pressed="false">🔇 الصوت</button>
    </section>

    <!-- overview + facts -->
    <section class="cs-section cs-overview" id="cs-overview">
      <div class="cs-over-copy">
        <p class="cs-label">— نبذة عن المشروع</p>
        <p class="cs-intro" data-cs-intro></p>
        <div class="cs-objective" data-cs-objective-wrap hidden>
          <b>الهدف</b>
          <p data-cs-objective></p>
        </div>
      </div>
      <aside class="cs-facts" data-cs-facts></aside>
    </section>

    <!-- palette (design only) -->
    <section class="cs-section cs-palette-wrap" data-cs-palette-wrap hidden id="cs-palette">
      <p class="cs-label">— نظام الألوان</p>
      <div class="cs-palette" data-cs-palette></div>
    </section>

    <!-- phases -->
    <section class="cs-section" data-cs-phases-wrap hidden id="cs-phases">
      <p class="cs-label">— رحلة العمل</p>
      <h2 class="cs-h2" data-phases-heading>من الفكرة إلى التسليم</h2>
      <nav class="cs-toc" data-cs-toc aria-label="فهرس المراحل" hidden></nav>
      <div class="cs-phases" data-cs-phases></div>
    </section>

    <!-- gallery -->
    <section class="cs-section" data-cs-gallery-wrap hidden id="cs-shots">
      <p class="cs-label">— لقطات من العمل</p>
      <div class="cs-gallery" data-cs-gallery></div>
    </section>

    <!-- outcome -->
    <section class="cs-section cs-outcome" data-cs-outcome-wrap hidden id="cs-outcome">
      <p class="cs-label">— النتيجة</p>
      <p class="cs-outcome-text" data-cs-outcome></p>
      <blockquote class="cs-quote" data-cs-quote-wrap hidden>
        <p data-cs-quote></p>
        <cite data-cs-quote-author></cite>
      </blockquote>
    </section>

    <!-- prev / next -->
    <nav class="cs-siblings" data-cs-siblings aria-label="مشاريع أخرى"></nav>

    <!-- CTA -->
    <section class="cs-cta">
      <h2>عندك مشروع مشابه؟</h2>
      <p>خلينا نبني قصتك القادمة — من الفكرة إلى الإطلاق.</p>
      <a class="g-cta" href="/#contact">ابدأ مشروعك</a>
    </section>

  </main>

  <aside class="cs-rail" data-cs-rail aria-label="تنقل المراحل" hidden></aside>

  <footer class="g-footer"><span data-brand>Wexon</span> — إبداع بصري وهويات تتحرك</footer>

</body>
</html>
